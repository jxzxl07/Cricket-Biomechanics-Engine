# Render blueprint for CreaseLab. The Docker service serves both the compiled
# React application and FastAPI, so one public URL is sufficient and frontend /
# backend URL configuration cannot drift.

services:
  - type: web
    name: creaselab
    runtime: docker
    # Measured inside this image: ~190 MB idle with models loaded, 442-491 MB peak
    # during an analysis (MediaPipe pose dominates; ONNX arenas are disabled in
    # the model adapters). 491 MB on a 512 MB free instance is too close to the
    # limit to rely on, so the blueprint asks for 1 CPU / 2 GB. Change `plan` to
    # `free` only if you accept out-of-memory restarts on longer clips.
    plan: standard
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_COACH_MODEL
        value: gpt-4o-mini
      - key: ANALYSIS_TIME_BUDGET_SECONDS
        value: "55"
      - key: PYTHONUNBUFFERED
        value: "1"
