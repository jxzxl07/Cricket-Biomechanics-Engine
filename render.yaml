# Render blueprint for CreaseLab: Dockerized FastAPI backend + static React frontend.
#
# The service names below produce https://<name>.onrender.com URLs. After the
# first deploy, keep VITE_API_BASE_URL and CORS_ORIGINS in sync with the real
# names (update both if you rename a service in the Render dashboard).

services:
  - type: web
    name: creaselab-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        value: https://creaselab-web.onrender.com,http://localhost:5173
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_COACH_MODEL
        value: gpt-4o-mini
      - key: ANALYSIS_TIME_BUDGET_SECONDS
        value: "55"
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: creaselab-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked in at build time; change together with the api service name.
      - key: VITE_API_BASE_URL
        value: https://creaselab-api.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
